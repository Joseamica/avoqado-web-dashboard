# ⚠️ PRUEBA DE COSTO EN UBICLOUD (12-oct-2026) — rama desechable, NO FUSIONAR.
# Sólo corre en ramas ci/ubicloud-**; sin jobs de deploy; permisos de sólo lectura.
name: 🧪 PRUEBA Ubicloud — 5 · Dashboard en Standard

on:
  push:
    branches: ['ci/ubicloud-**']

# Cancel outdated workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '20'
  # Shared VITE_ vars — same Firebase/Google project across all environments (public client-side keys)
  VITE_FIREBASE_API_KEY: 'AIzaSyDO_YD4EhiJVcmS-7O189B7J3j0cwPp1lQ'
  VITE_FIREBASE_AUTH_DOMAIN: 'avoqado-d0a24.firebaseapp.com'
  VITE_FIREBASE_RECAPTCHA_SITE_KEY: '6LcM7AcqAAAAADw4D1UBS38j30SXxn3OTl2jAqi3'
  VITE_GOOGLE_CLIENT_ID: '219752736783-r20hp7rn5aam58o5vn5qr7ij46pqhht8.apps.googleusercontent.com'
  VITE_STRIPE_PUBLISHABLE_KEY: 'pk_test_XCv57wYNRXqzP7A5exFgiw4d005M9XPM6X'
  # PostHog product analytics (public client key — safe to expose, like the keys above)
  VITE_POSTHOG_KEY: 'phc_ywJ2xb3rYnXnaipgNQ6tbqS5pZK8HamLUNo4bUMsingG'
  VITE_POSTHOG_HOST: 'https://us.i.posthog.com'

jobs:
  # 🧪 Quality Gate: Test, lint and build
  test-and-build:
    name: 🧪 Test, Lint & Build
    runs-on: ubicloud-standard-4
    # Skip draft PRs
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    outputs:
      version: ${{ steps.package-version.outputs.version }}
      build-time: ${{ steps.build-info.outputs.build-time }}
      build-size: ${{ steps.build-size.outputs.size }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🔎 Máquina (para la medición)
        run: echo "nproc=$(nproc) mem=$(free -g | awk '/Mem:/{print $2}')GB cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ✅ OPTIMIZATION: Cache node_modules for 2-3 min savings
      - name: 📦 Cache node_modules
        uses: actions/cache@v5
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-
            ${{ runner.os }}-node-

      - name: 📦 Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # ✅ OPTIMIZATION: Only run linting on code changes
      - name: 📏 Run ESLint
        run: npm run lint

      - name: 🌐 Run i18n validation
        run: npm run lint:i18n

      # `npx tsc --noEmit` at the repo root type-checked ZERO files: the root
      # tsconfig.json has `files: []` and only references the app/node projects,
      # so that step was always green no matter what. `tsc -b` walks the project
      # references (both have `noEmit: true`) and is the real check — the same
      # one `npm run build` runs first. The script carries the 8 GB heap ceiling
      # that project-wide type-checking needs on this codebase.
      - name: 🔍 TypeScript compilation check
        run: npm run typecheck

      - name: 🔐 Run auth/routing regression suite
        timeout-minutes: 15
        run: npm run test:auth-routing -- --pool=forks --maxWorkers=1 --testTimeout=20000 --hookTimeout=20000

      - name: 🏗️ Build application (CI validation only)
        run: npm run build
        env:
          # CI validation build — not deployed. Each deploy job rebuilds with correct API URL.
          VITE_API_URL: 'https://api.avoqado.io'

      - name: 🎭 Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs the Playwright suite against the bundle just built, served by
      # `vite preview` on :4173 (playwright.config.ts skips its own dev server when
      # E2E_BASE_URL is set). Every `/api/v1/**` call is intercepted by page.route
      # in the specs, so no test reaches a real backend. This is the gate that
      # catches a stale spec after a product change (route renames, response shapes).
      - name: 🎭 Playwright E2E (against the built bundle)
        timeout-minutes: 30
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4173 && break
            sleep 1
          done
          E2E_BASE_URL=http://localhost:4173 npx playwright test --workers=2

      - name: 📤 Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

      - name: 📊 Get package version
        id: package-version
        run: echo "version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: ⏰ Build info
        id: build-info
        run: echo "build-time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: 📐 Calculate build size
        id: build-size
        run: |
          SIZE=$(du -sh dist/ | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "📐 Build size: $SIZE"

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-build-${{ github.sha }}
          path: dist/
          retention-days: 7
